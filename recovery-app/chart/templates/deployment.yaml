
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: default
spec:
  containers:
    - name: nginx
      image: {{ .Values.image.name }}:{{ .Values.image.tag }}
      volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: nginx-storage
      ports:
      - containerPort: 80
  volumes:
    - name: nginx-storage
      persistentVolumeClaim:
        claimName: nginx-pvc
